# The jog wheel. `vinyl` is two controls in one action: without a hand on the platter it is a
# pitch bend (`step` is unused then), and with one it *scrubs* — `step` frames of audio per tick,
# 1323 by default. That number is the vinyl physics: one revolution at 33⅓ RPM is 1.8 s, so
# `frames_per_tick = 79380 / messages per revolution` (1323 for a 60-detent wheel; 441 to place
# things finely). Turn the wheel one revolution in the guide's raw monitor to count yours.
#
# `mode = "rel2"` because this controller sends **1 / 127** for the two directions (sign in the
# value's high bit, magnitude in the low bits). `rel1` would be the other convention — centred on 64,
# so 65 = one step forward and 1 = sixty-three steps *back* — which reads as a wild, one-directional
# jump rather than a turn. Check yours in the guide's raw monitor: values near 63/64/65 = `rel1`,
# values like 1,2,3 / 127,126 = `rel2` (or `rel3` for direction only).
[[bind]]
type = "cc"
mode = "rel2"
channel = 0
id = 6
deck = 0
action = "vinyl"

[[bind]]
type = "cc"
mode = "rel2"
channel = 1
id = 6
deck = 1
action = "vinyl"

# The platter sensor: a note that is down while a hand is on the wheel. It pauses the deck, so the
# wheel turns into a scrub until you let go.
[[bind]]
type = "note"
channel = 0
id = 80
deck = 0
action = "vinyl"

[[bind]]
type = "note"
channel = 1
id = 80
deck = 1
action = "vinyl"

