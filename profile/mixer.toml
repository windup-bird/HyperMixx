# Hypermixx mixer topology. `--print-config` prints this; edit and pass back via --config (or edit
# this file in place — it is what a run without `--config` reads).
#
# Signal path, per channel. The stage order is fixed; configuration decides what sits in each bank:
#
#   per flow:   source fader (stem mute/solo gate) → flow fader → eq → filter → flowfx… ─┐
#                                                                             Σ ────────┘
#   per deck:   trim → knobfx… → padfx… → [cue tap `pre`] → fader → [cue tap `post`]
#               → crossfader → master
#
# `eq` and `filter` are part of the path (the only choice is the sweep's kind); `flowfx` runs on
# each flow before the merge, `knobfx`/`padfx` on the summed channel. `cue` picks which side of the
# fader the cue send taps: `pre` (default) is what cueing a track in means, `post` makes the fader
# silence the headphones too.
#
# Every fader is attenuation only: the top of its travel is 0 dB. Headroom is `gain` (up to +6 dB,
# on the flow sum before the banks), which is a setting rather than a performance control.

# One [[channel]] per deck. Omitted keys take the defaults shown in comments.
[[channel]]
side = "left"                 # left | right | center
filter = "linear"             # linear | moog — the fixed sweep stage's kind
cue = "pre"                   # pre | post — which side of the fader the cue send taps
# deck_fader = 0.0            # the channel fader's starting level; top of travel = 0 dB
# gain = 0.0                  # channel trim: 0 = 0 dB, +1 = +6 dB, -1 = silence
cue_send = 1.0                # linear 0..1 into the cue bus
# flow_fx = []                # per-flow inserts (after eq/filter, before the flow sum): one chain
#                             # per flow, so four stems get four independent instances
# knob_fx = []                # post-merge knob bank, e.g. ["echo"]
# pad_fx = []                 # post-merge pad bank, e.g. ["reverb"]
# flow_fader = 0.0            # per-flow (stem) level; top of travel = 0 dB

[[channel]]
side = "right"
filter = "linear"
cue = "pre"
cue_send = 1.0

# The shared crossfader: one physical control, applied on each channel by its `side`.
[crossfader]
place = "deck"                # source | flow | deck — where in the channel path its gain acts
curve = "classic"             # classic | constant_power | cut
# start = 0.0                 # starting position, -1 hard left .. 1 hard right
# cut_width = 0.05            # `cut`: fraction of the travel the drop takes, at each end

[master]
# fx = []                     # inserts on the summed mix
limiter = true                # the safety stage; strongly recommended
# fader = 0.0                 # master trim (0 = unity)

[cue]
# fader = 0.0                 # cue bus trim (0 = unity)
# blend = -1.0                # -1 = cue only (default), 0 = both, +1 = master only
# curve = "classic"           # classic | constant_power | cut
# cut_width = 0.05

# One [[output]] per destination. `name` and `role` are required; the rest has defaults.
# `device` omitted = the system default device. Two outputs landing on one physical device with
# overlapping `channels` are summed by the server outside the limiter, so the later stream is
# dropped. Disjoint pairs are allowed on a multi-channel interface: main on [0, 1] and cue on [2, 3].
[[output]]
name = "main"
role = "master"               # master | cue
device = "sysdefault:CARD=III"
channels = [0, 1]
# device = "USB Headset"      # name substring (case-insensitive) or a device index; omit = default
# sample_rates = [44100]      # rates this destination may run at (default: the engine's own)
# channels = [0, 1]           # device channel pair
# gain = 1.0                  # per-destination trim

[[output]]
name = "headphones"
role = "cue"
device = "sysdefault:CARD=III"
channels = [2, 3]
# device = "Headphones"
# channels = [2, 3]           # e.g. a 4-channel interface, disjoint from main
