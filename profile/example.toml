# An example named profile. Copy it to `profile/<your-name>.toml` and run `--profile <your-name>`.
#
# Paths are relative to *this file's folder* (`profile/`), which is also where the files it names
# live — so a name alone is enough.

mixer = "mixer.toml"
live = "live.toml"
controller = "partymix3.toml"

# Or point at something else entirely:
# mixer = "../sets/club.toml"

# `controller` points at a map file; its `[meta].device` names the input port. The old `midi =`
# spelling still parses.

# Reserved (see profile/preference.toml).
[preference]
