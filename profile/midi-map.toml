# Hypermixx MIDI map — a fuller example.
#
# Units are independent: deck0 and deck1 keep their own active mode. A selector is not an action;
# `trigger` sets the named mode, `cycle` advances through the declared order.
#
# Built-in presets: touchpad | mixer | transport | browser | output | jog
# All endpoints are unique across the file. Adjust the channel/id pairs to your controller; the
# preset slot names and mode tables stay the same.

[meta]
name = "example"
# device = "DDJ-400"
# User presets live next to this file; a same-name preset replaces the built-in one.
presets = ["presets/example.toml"]

# ---- deck 0 pad grid -------------------------------------------------------------------------
[[unit]]
id = "deck1.pad"
preset = "touchpad"
deck = 1

[[unit.control]]
