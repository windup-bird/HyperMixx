# ---- deck FX (user preset) -------------------------------------------------------------------
# `presets/example.toml` supplies the `deckfx` preset. Two knobs, two modes; the selector below
# cycles filter -> eq, and the same physical knobs change meaning.
[[unit]]
id = "deck1.deckfx"
preset = "deckfx"
deck = 1

[[unit.control]]
slot = "knob1"
type = "cc"
channel = 0
id = 20
[[unit.control]]
slot = "knob2"
type = "cc"
channel = 0
id = 21

[[unit.selector]]
type = "note"
channel = 0
id = 28
behavior = "cycle"

[[unit]]
id = "deck2.deckfx"
preset = "deckfx"
deck = 2

[[unit.control]]
