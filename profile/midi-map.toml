# Hypermixx MIDI map — a fuller example.
#
# Units are independent: deck1 and deck2 keep their own active mode. A mode key is an ordinary
# control with `role = "mode_trigger"` or `role = "mode_cycle"`; it switches the unit's mode and
# emits no command. Endpoints are unique across the whole file.
#
# Built-in presets: browser | crossfader | deckfx1 | deckfx2 | deckfx3 | jog | manualjump |
# manualloop | mixer | outputfader | pad | tempofader | transport

[meta]
name = "example"
# device = "DDJ-400"
# User presets live next to this file; a same-name preset replaces the built-in one.
presets = ["presets/example.toml"]

# ---- deck 1 pad grid -------------------------------------------------------------------------
[[unit]]
id = "deck1.pad"
preset = "pad"
deck = 1

[[unit.control]]
slot = "pad1"
endpoint = { midi = "note", channel = 0, id = 16 }
[[unit.control]]
slot = "pad2"
endpoint = { midi = "note", channel = 0, id = 17 }
[[unit.control]]
slot = "pad3"
endpoint = { midi = "note", channel = 0, id = 18 }
[[unit.control]]
slot = "pad4"
endpoint = { midi = "note", channel = 0, id = 19 }
[[unit.control]]
slot = "pad5"
endpoint = { midi = "note", channel = 0, id = 20 }
[[unit.control]]
slot = "pad6"
endpoint = { midi = "note", channel = 0, id = 21 }
[[unit.control]]
slot = "pad7"
endpoint = { midi = "note", channel = 0, id = 22 }
[[unit.control]]
slot = "pad8"
endpoint = { midi = "note", channel = 0, id = 23 }

[[unit.control]]
slot = "mode-hotcue"
role = "mode_trigger"
target = "hotcue"
endpoint = { midi = "note", channel = 0, id = 24 }
[[unit.control]]
slot = "mode-loop"
role = "mode_trigger"
target = "loop"
endpoint = { midi = "note", channel = 0, id = 25 }
[[unit.control]]
slot = "mode-beatjump"
role = "mode_trigger"
target = "beatjump"
endpoint = { midi = "note", channel = 0, id = 26 }
[[unit.control]]
slot = "mode-stems"
role = "mode_trigger"
target = "stems"
endpoint = { midi = "note", channel = 0, id = 27 }
[[unit.control]]
slot = "mode-next"
role = "mode_cycle"
endpoint = { midi = "note", channel = 0, id = 28 }

# ---- deck 2 pad grid -------------------------------------------------------------------------
[[unit]]
id = "deck2.pad"
preset = "pad"
deck = 2

[[unit.control]]
slot = "pad1"
endpoint = { midi = "note", channel = 1, id = 16 }
[[unit.control]]
slot = "pad2"
endpoint = { midi = "note", channel = 1, id = 17 }
[[unit.control]]
slot = "pad3"
endpoint = { midi = "note", channel = 1, id = 18 }
[[unit.control]]
slot = "pad4"
endpoint = { midi = "note", channel = 1, id = 19 }
[[unit.control]]
slot = "pad5"
endpoint = { midi = "note", channel = 1, id = 20 }
[[unit.control]]
slot = "pad6"
endpoint = { midi = "note", channel = 1, id = 21 }
[[unit.control]]
slot = "pad7"
endpoint = { midi = "note", channel = 1, id = 22 }
[[unit.control]]
slot = "pad8"
endpoint = { midi = "note", channel = 1, id = 23 }

[[unit.control]]
slot = "mode-hotcue"
role = "mode_trigger"
target = "hotcue"
endpoint = { midi = "note", channel = 1, id = 24 }
[[unit.control]]
slot = "mode-loop"
role = "mode_trigger"
target = "loop"
endpoint = { midi = "note", channel = 1, id = 25 }
[[unit.control]]
slot = "mode-beatjump"
role = "mode_trigger"
target = "beatjump"
endpoint = { midi = "note", channel = 1, id = 26 }
[[unit.control]]
slot = "mode-stems"
role = "mode_trigger"
target = "stems"
endpoint = { midi = "note", channel = 1, id = 27 }
[[unit.control]]
slot = "mode-next"
role = "mode_cycle"
endpoint = { midi = "note", channel = 1, id = 28 }

# ---- transport -------------------------------------------------------------------------------
[[unit]]
id = "deck1.transport"
preset = "transport"
deck = 1

[[unit.control]]
slot = "play"
endpoint = { midi = "note", channel = 0, id = 0 }
[[unit.control]]
slot = "cue"
endpoint = { midi = "note", channel = 0, id = 1 }
[[unit.control]]
slot = "sync"
endpoint = { midi = "note", channel = 0, id = 2 }
[[unit.control]]
slot = "keylock"
endpoint = { midi = "note", channel = 0, id = 3 }

[[unit]]
id = "deck2.transport"
preset = "transport"
deck = 2

[[unit.control]]
slot = "play"
endpoint = { midi = "note", channel = 1, id = 0 }
[[unit.control]]
slot = "cue"
endpoint = { midi = "note", channel = 1, id = 1 }
[[unit.control]]
slot = "sync"
endpoint = { midi = "note", channel = 1, id = 2 }
[[unit.control]]
slot = "keylock"
endpoint = { midi = "note", channel = 1, id = 3 }

# ---- channel strips ---------------------------------------------------------------------------
# The mixer preset's EQ/filter rows resolve `chain` from the unit's deck, so the same preset works
# on deck1 and deck2 without editing names.
[[unit]]
id = "deck1.mixer"
preset = "mixer"
deck = 1

[[unit.control]]
slot = "fader"
endpoint = { midi = "cc", channel = 0, id = 7 }
[[unit.control]]
slot = "gain"
endpoint = { midi = "cc", channel = 0, id = 8 }
[[unit.control]]
slot = "low"
endpoint = { midi = "cc", channel = 0, id = 9 }
[[unit.control]]
slot = "mid"
endpoint = { midi = "cc", channel = 0, id = 10 }
[[unit.control]]
slot = "high"
endpoint = { midi = "cc", channel = 0, id = 11 }
[[unit.control]]
slot = "filter"
endpoint = { midi = "cc", channel = 0, id = 12 }
[[unit.control]]
slot = "cue-toggle"
endpoint = { midi = "note", channel = 0, id = 13 }

[[unit]]
id = "deck2.mixer"
preset = "mixer"
deck = 2

[[unit.control]]
slot = "fader"
endpoint = { midi = "cc", channel = 1, id = 7 }
[[unit.control]]
slot = "gain"
endpoint = { midi = "cc", channel = 1, id = 8 }
[[unit.control]]
slot = "low"
endpoint = { midi = "cc", channel = 1, id = 9 }
[[unit.control]]
slot = "mid"
endpoint = { midi = "cc", channel = 1, id = 10 }
[[unit.control]]
slot = "high"
endpoint = { midi = "cc", channel = 1, id = 11 }
[[unit.control]]
slot = "filter"
endpoint = { midi = "cc", channel = 1, id = 12 }
[[unit.control]]
slot = "cue-toggle"
endpoint = { midi = "note", channel = 1, id = 13 }

# ---- tempo faders ----------------------------------------------------------------------------
[[unit]]
id = "deck1.tempo"
preset = "tempofader"
deck = 1

# The tempo fader. If the device sends a 14-bit pair (e.g. #9 + #41), write
# `endpoint = { midi = "cc", id = 9, lsb = 41, ... }` instead — but only when #9 is not already
# claimed by another slot.
[[unit.control]]
slot = "fader"
endpoint = { midi = "cc", lsb = 40, channel = 0, id = 39 }
[[unit.control]]
slot = "bend-backward"
endpoint = { midi = "note", channel = 0, id = 4 }
[[unit.control]]
slot = "bend-forward"
endpoint = { midi = "note", channel = 0, id = 5 }

[[unit]]
id = "deck2.tempo"
preset = "tempofader"
deck = 2

[[unit.control]]
slot = "fader"
endpoint = { midi = "cc", lsb = 40, channel = 1, id = 39 }
[[unit.control]]
slot = "bend-backward"
endpoint = { midi = "note", channel = 1, id = 4 }
[[unit.control]]
slot = "bend-forward"
endpoint = { midi = "note", channel = 1, id = 5 }

# ---- loops and jumps -------------------------------------------------------------------------
[[unit]]
id = "deck1.loop"
preset = "manualloop"
deck = 1

[[unit.control]]
slot = "in"
endpoint = { midi = "note", channel = 0, id = 32 }
[[unit.control]]
slot = "out"
endpoint = { midi = "note", channel = 0, id = 33 }
[[unit.control]]
slot = "exit"
endpoint = { midi = "note", channel = 0, id = 34 }
[[unit.control]]
slot = "double"
endpoint = { midi = "note", channel = 0, id = 35 }
[[unit.control]]
slot = "halve"
endpoint = { midi = "note", channel = 0, id = 36 }
[[unit.control]]
slot = "autoloop"
endpoint = { midi = "cc", encoding = "two_point", channel = 0, id = 37 }

[[unit]]
id = "deck2.loop"
preset = "manualloop"
deck = 2

[[unit.control]]
slot = "in"
endpoint = { midi = "note", channel = 1, id = 32 }
[[unit.control]]
slot = "out"
endpoint = { midi = "note", channel = 1, id = 33 }
[[unit.control]]
slot = "exit"
endpoint = { midi = "note", channel = 1, id = 34 }
[[unit.control]]
slot = "double"
endpoint = { midi = "note", channel = 1, id = 35 }
[[unit.control]]
slot = "halve"
endpoint = { midi = "note", channel = 1, id = 36 }
[[unit.control]]
slot = "autoloop"
endpoint = { midi = "cc", encoding = "two_point", channel = 1, id = 37 }

# ---- deck FX ---------------------------------------------------------------------------------
# The shipped topology does not define fx1/fx2/fx3 yet. The deckfx1/2/3 presets are available in
# the guide; add units for them once the mixer exposes those stable slot names.

# ---- jog wheels ------------------------------------------------------------------------------
[[unit]]
id = "deck1.jog"
preset = "jog"
deck = 1

[[unit.control]]
slot = "jog"
endpoint = [
  { role = "press", midi = "note", channel = 0, id = 80 },
  { role = "turn", midi = "cc", encoding = "twos_complement", channel = 0, id = 6 },
]

[[unit]]
id = "deck2.jog"
preset = "jog"
deck = 2

[[unit.control]]
slot = "jog"
endpoint = [
  { role = "press", midi = "note", channel = 1, id = 80 },
  { role = "turn", midi = "cc", encoding = "twos_complement", channel = 1, id = 6 },
]

# ---- shared controls -------------------------------------------------------------------------
[[unit]]
id = "global.output"
preset = "outputfader"

[[unit.control]]
slot = "master"
endpoint = { midi = "cc", channel = 15, id = 8 }
[[unit.control]]
slot = "cue"
endpoint = { midi = "cc", channel = 15, id = 12 }

[[unit]]
id = "global.crossfader"
preset = "crossfader"

[[unit.control]]
slot = "fader"
endpoint = { midi = "cc", channel = 15, id = 10 }

[[unit]]
id = "global.browser"
preset = "browser"

[[unit.control]]
slot = "choose"
endpoint = { midi = "cc", encoding = "two_point", reverse = true, channel = 15, id = 0 }
[[unit.control]]
slot = "open"
endpoint = { midi = "note", channel = 15, id = 90 }
[[unit.control]]
slot = "exit"
endpoint = { midi = "note", channel = 15, id = 91 }
[[unit.control]]
slot = "load-1"
endpoint = { midi = "note", channel = 15, id = 92 }
[[unit.control]]
slot = "load-2"
endpoint = { midi = "note", channel = 15, id = 93 }
