channel = 1
id = 28
behavior = "cycle"

[[unit]]
id = "deck1.jog"
preset = "jog"
deck = 1

[[unit.control]]
slot = "jog"
kind = "JogWheel"
touch = { type = "note", channel = 0, id = 80 }
turn = { type = "cc", mode = "rel2", channel = 0, id = 6 }

[[unit]]
id = "deck2.jog"
preset = "jog"
deck = 2

[[unit.control]]
slot = "jog"
kind = "JogWheel"
touch = { type = "note", channel = 1, id = 80 }
turn = { type = "cc", mode = "rel2", channel = 1, id = 6 }

