# Hypermixx configuration — one file, one path.
#
# `--config <file>` reads exactly that file. With no flag, the platform default is used:
#   Linux / Termux : $XDG_CONFIG_HOME/hypermixx/config.toml  (or ~/.config/hypermixx/config.toml)
#   Windows        : %APPDATA%/Hypermixx/config.toml
# On the first start this template is copied there; an existing file is never overwritten.
# `HYPERMIXX_CONFIG` overrides the path. `--print-config` prints this template.
#
# Every section is optional: a missing key takes its built-in default. Paths inside the config are
# relative to this file's folder.

[mixer]
# The stage order is fixed; a config only chooses what sits in each bank. `eq` and `filter` are
# always the tone prefix of every flow.

[[mixer.channel]]
side = "left"
filter = "linear"        # linear | moog — the fixed sweep stage's kind
cue = "pre"              # pre | post — which side of the fader the cue send taps
cue_send = 1.0
# knob_fx = ["echo"]     # post-merge knob bank
# pad_fx = ["reverb"]    # post-merge pad bank
# [[mixer.channel.flow_fx]]
# kind = "filter"
# flows = ["vocals"]     # omitted = every flow, [] = none

[[mixer.channel]]
side = "right"
filter = "linear"
cue = "pre"
cue_send = 1.0

[mixer.crossfader]
place = "deck"           # source | flow | deck
curve = "classic"        # classic | constant_power | cut

[mixer.master]
limiter = true           # the safety stage; strongly recommended
# fx = []

[mixer.cue]
# blend = -1.0           # -1 = cue only (default), 0 = both, +1 = master only

[[mixer.output]]
name = "main"
role = "master"
channels = [0, 1]
# device = "..."         # name substring or device index; omit = the system default

[[mixer.output]]
name = "headphones"
role = "cue"
channels = [2, 3]

[live]
# Machine settings. Omitted keys take the built-in defaults.
# [live.audio]
# sample_rate = 44100
# [live.keylock]
# block = 2048
# [live.stems]
# provider = "cpu"
# [live.autogain]
# enabled = false
# target_db = -12.0

[preference]
# TUI tastes. Omitted keys take the built-in defaults.
# [preference.waveform]
# backend = "auto"
# low_hz = 250
# high_hz = 4000

[controller]
# `map` is a file pointer to a unit-map file, relative to this config's folder. Leaving it out
# means no controller input. `device` overrides the map's `[meta].device`.
# map = "mapping.toml"
# device = "..."
