# Hypermixx configuration — one file, one path.
#
# `--config <file>` reads exactly that file. With no flag, the platform default is used:
#   Linux / Termux : $XDG_CONFIG_HOME/hypermixx/config.toml  (or ~/.config/hypermixx/config.toml)
#   Windows        : %APPDATA%/Hypermixx/config.toml
# On the first start this template is copied there; an existing file is never overwritten.
# `HYPERMIXX_CONFIG` overrides the path. Four decks: start with `--4-decks`.
#
# Every section is optional: a missing key takes its built-in default. Paths inside the config are
# relative to this file's folder.

[multideck]
# Controller mapping only: the deck count comes from the front-end (`--4-decks`, two by default),
# not from this list. Row 1 is deck1, row 2 is deck2, and so on; `[mixer]` holds the audio topology
# every deck shares, and the few fields here are the values a DJ sets per deck.
# `source` names the controller surface that drives a deck: <controller-id>.<face>[.mirror].
# Omit `.mirror` for the normal variant; omit `source` for a deck no controller owns. A two-deck
# controller driving four decks maps the extra two to its mirror faces, e.g.
#   source = "ctl1.A.mirror"   (deck3)
#   source = "ctl1.B.mirror"   (deck4)
[[multideck.deck]]
source = "ctl1.A"
side = "left"
cue_send = 1.0

[[multideck.deck]]
source = "ctl1.B"
side = "right"
cue_send = 1.0

# One MIDI session per controller. Each entry opens its own port and unit map; the `source` labels
# above decide which face each deck belongs to, so two devices never address the same deck unless
# their sources say so. Omit the section for a rig with no controller.
# [[controller]]
# id = "ctl1"
# device = "Controller-A"
# map = "mapping.toml"
#
# [[controller]]
# id = "ctl2"
# device = "Controller-B"
# map = "mapping2.toml"

[mixer]
# The mixer's own sections. The stage order is fixed; a config only chooses what sits in each bank.
# `eq` and `filter` are always the tone prefix of every flow.

[mixer.crossfader]
curve = "classic"        # classic | constant_power | cut

[mixer.fx]
master_fx = []           # master-bus effects, before the limiter
flow_fx = []             # per-flow inserts (template: one chain per flow)
knob_fx = []             # post-merge knob bank
pad_fx = []              # post-merge pad bank
filter = "linear"        # linear | moog — the fixed sweep stage's kind, every channel

# Per-flow routing still uses tables, now under `[mixer.fx]`:
# [[mixer.fx.flow_fx]]
# kind = "filter"
# flows = ["vocals"]     # omitted = every flow, [] = none

[mixer.eq]
lower_hz = 250           # low/mid boundary
higher_hz = 2000         # mid/high boundary; the mid bell sits at their geometric centre

[mixer.limiter]
limiter = true            # the safety stage; on unless explicitly turned off
ceiling_db = -1.0         # dBFS, −40 .. +12; the limiter's ceiling

[mixer.fader]
position = "pre"         # pre | post — which side of the channel fader the cue send taps
crossfader_curve = "classic"  # cue/master blend curve: classic | constant_power | cut
cue_blend = -1.0         # -1 = cue only (default), 0 = both, +1 = master only

[mixer.autogain]
enabled = false          # off by default: a mixer that silently changes level is a surprise
target_db = -12.0        # dBFS for the loudest ~3 s of a track

[mixer.cue]
# curve = "classic"       # cue/master blend curve (same as [mixer.fader].crossfader_curve)
# cut_width = 0.05        # the cut curve's fade width at each end

[[mixer.output]]
name = "main"
role = "master"
channels = [0, 1]
# device = "..."         # name substring or device index; omit = the system default

[[mixer.output]]
name = "headphones"
role = "cue"
channels = [2, 3]

[live]
# Machine settings. Omitted keys take the built-in defaults.
# [live.audio]
# sample_rate = 44100
# [live.keylock]
# block = 2048
# [live.stems]
# provider = "cpu"

[preference]
# TUI tastes. Omitted keys take the built-in defaults.

[preference.waveform]
backend = "auto"         # auto (kitty -> braille) | kitty | braille
low_hz = 250
high_hz = 4000
# refresh_hz = 60       # image backend target, 10..60
# cell = "8x16"         # terminal cell size in pixels

# Interface colours. `#rgb` or `#rrggbb`; the commented values are the built-in defaults.
[preference.theme]
# accent = "#00ffff"
# dim = "#444444"
# text = "#ffffff"
# error = "#ff0000"
# warn = "#ffff00"
# pad = "#406080"

# Library sources. An absent or empty category is neither scanned nor displayed.
# local: formats in local user locations (`~/Music`, `~/.VirtualDJ`, ...)
# usb: formats on automatically discovered/mounted removable media
# folders: plain folders to index; `~` expands to the home directory
[preference.library]
local = []
usb = ["rkb", "serato", "vdj"]
folders = ["~/Music"]

# Imported-grid calibration. "auto" probes each file; a number overrides it, 0 disables the fix.
decoder_start_ms = "auto"
grid_offset_ms = 0.0
rkb_mp3_offset_ms = 0.0
serato_offset_ms = -16.5
vdj_offset_ms = 0.0

[preference.display]
key = "camelot"          # camelot (8A/8B) | classic (Am/C)
follow = true            # CLI/MIDI 命令与 modetrigger 自动切到对应面板

# Analysis backends, named directly — there is no automatic backend fallback.
# auto_analyse only decides whether a browser load with no grid analyses in the background.
#   timestretch : tracked beat sequence + kick-band phase corroboration + key (default)
#   stratum     : multi-method BPM + onset beat list
[preference.analysis]
beats = "timestretch"
key = "timestretch"
auto_analyse = false        # analyse a browser load when no imported/cached grid exists

[controller]
# `map` is a file pointer to a unit-map file, relative to this config's folder. Leaving it out
# means no controller input. `device` overrides the map's `[meta].device`.
# map = "mapping.toml"
# device = "..."
