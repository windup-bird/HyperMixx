# Shipped unit-map template. `[controller].map` in config.toml points at a copy of this file.
[meta]
# device = "..."   # a port name or index; config.toml's [controller] device overrides it

# Press the mirror toggle to make every deck-scoped unit below drive its mirror deck. Which
# physical deck that is comes from `[[multideck.deck]] source = "<controller>.<face>.mirror"`.
[[unit]]
id = "global.mirror"
preset = "mirror-deck"
mode = []

[[unit.control]]
slot = "toggle"
type = "Button"
role = "deck_mirror"

[unit.control.endpoint]
midi = "note"
channel = 15
id = 60

[[unit]]
id = "global.browser"
preset = "browser"
mode = []

[[unit.control]]
slot = "choose"
type = "RelKnob"

[unit.control.endpoint]
midi = "cc"
encoding = "two_point"
channel = 15
id = 0

[[unit.control]]
slot = "open"
type = "Button"

[unit.control.endpoint]
midi = "note"
channel = 15
id = 7

[[unit.control]]
slot = "load-1"
type = "Button"

[unit.control.endpoint]
midi = "note"
channel = 15
id = 2

[[unit.control]]
slot = "load-2"
type = "Button"

[unit.control.endpoint]
midi = "note"
channel = 15
id = 3

# The crossfader is a controller-internal concept: each mode names the pair of physical decks it
# spans. `AB` uses the normal faces, `AmBm` their mirror decks. `mode-next` cycles between them;
# the same `fader cross <left> <right>` also accepts literal deck numbers.
[[unit]]
id = "global.crossfader"
preset = "crossfader"
start = "AB"
mode_order = ["AB", "AmBm"]

[[unit.control]]
slot = "fader"
type = "BipolKnob"

[unit.control.endpoint]
midi = "cc"
channel = 15
id = 8

[[unit.control]]
slot = "mode-next"
type = "Button"
role = "mode_cycle"

[unit.control.endpoint]
midi = "note"
channel = 15
id = 61

[[unit.mode]]
name = "AB"
[[unit.mode.bind]]
slot = "fader"
action = "fader cross A B"

[[unit.mode]]
name = "AmBm"
[[unit.mode.bind]]
slot = "fader"
action = "fader cross Am Bm"

[[unit]]
id = "global.outputfader"
preset = "outputfader"
mode = []

[[unit.control]]
slot = "master"
type = "Knob"

[unit.control.endpoint]
midi = "cc"
channel = 15
id = 10

[[unit.control]]
slot = "cue"
type = "Knob"

[unit.control.endpoint]
midi = "cc"
channel = 15
id = 12

[[unit]]
id = "deck1.jog"
