# Hypermixx live settings: what depends on *this machine* rather than on the music.
#
# Paths, for reference (all relative to the working directory, and overridable):
#   ./.cache/stems/<key>/   separated audio            HYPERMIXX_CACHE
#   ./.model/<name>.onnx    downloaded models          HYPERMIXX_MODELS
#   ./profile/              this file and the topology
#
# Read at startup (or `--live <file>`); `live show` prints what is in effect and `live reload`
# re-reads this file. A key that is missing takes the built-in default, so this file is a starting
# point rather than a complete one.

[audio]
# The rate the engine renders at *and* asks every device for. Material is resampled to it when it is
# loaded, so this is the engine's clock rather than a per-destination setting. A device that cannot
# take it leaves its output `disabled` (see the `output` command) instead of playing at the wrong
# speed.
# Any rate the device takes works: 44100, 48000, 88200, 96000, ... (8 kHz .. 384 kHz). Nothing
# downstream assumes a particular one — the decoder resamples material to it, FX coefficients are
# designed at it, and stem separation converts to/from the model's own 44.1 kHz when they differ.
sample_rate = 48000
# Output ring capacity in frames: more slack for a slow device, more latency.
# 1024 frames is ~23 ms at 44.1 kHz (~21 ms at 48 kHz). For a more conservative setup use 2048; for an aggressive
# one, 512 works but leaves less room for scheduler jitter.
#
# This is a *floor*. A device whose callback asks for more than this (ALSA's `avail_frames` can be a
# whole PCM buffer, and paths that refuse `device_buffer_frames` — `dmix`/`plug` behind `sysdefault`
# — decide their own) makes the engine grow the ring to fit and log the size; put that number here to
# make the log quiet and to stop the one-time reopen.
ring_frames = 1024
# Frames of silence pushed into each ring before its stream starts, so the device never waits on the
# producer's first block. Capped at half the ring. 512 is one device buffer below; set 0 only if you
# prefer the shortest possible startup and accept a gap on `output refresh` during playback.
prefill_frames = 512
# Device buffer handed to cpal as BufferSize::Fixed. On ALSA the period is n/4, so 512 means a
# 128-frame period (~2.9 ms) and a 512-frame buffer (~11.6 ms). Omit (or 0) for the backend default,
# which on ALSA is a 25 ms period / 100 ms buffer. Aggressive: 256 (64-frame period, ~5.8 ms buffer),
# but expect xruns on ordinary desktop scheduling.
#
# Best effort: a path that refuses a fixed buffer — ALSA's dmix/plug behind `sysdefault`/`default`,
# which is how a USB controller's own interface is normally reached — falls back to the backend's
# default instead of failing the stream (a failed stream is a silent output).
device_buffer_frames = 512

[keylock]
# The STFT window used by the keylock engine. Both values are in frames and are rounded to powers of
# two; interval is clamped to at most block / 2. Bigger block = better frequency resolution and more
# read-ahead: 2048/512 is ~46 ms, 4096/1024 is ~93 ms, 8192/1024 is ~186 ms. Read at startup, so a
# running deck only picks up an edit after a restart (`live show` reports the effective values).
# block = 2048
# interval = 512

[autogain]
# Normalise every track to a target level, measured from the average level of its loudest ~3 s.
# Applied per flow, right after the flow fader and before the channel trim, so the tone controls and
# the per-flow inserts see the matched level. `live reload` applies a change immediately to whatever
# is loaded (the measurement lives on the deck; only the preference changes here).
enabled = false               # off by default: a mixer should not change levels unasked
target_db = -12.0             # dBFS for the loudest section; the gain is clamped to ±12 dB

[stems]
# Everything the separator is asked for. These are *machine* settings, which is why they live here
# and not on the command line: `stem separate` takes no options, and `live reload` applies an edit
# immediately (the next separation uses it).

# Which model to separate with, from the table in `hypermixx-stems` (`stem model list`). A **path**
# to a local `.onnx` works too — your own export, a quantized build, a fine-tune.
#
# htdemucs       316 MB  the fastest 4-stem export; 1 session, all four stems  (default)
# htdemucs-fp16  166 MB  the same graph with fp16-stored weights: **half the download, same speed**
#
# `stem separate --model <name|path>` overrides this for one run; the model is part of the cache key,
# so two models never share an entry.
# model = "htdemucs"

# Execution provider: cpu (always available) or cuda (needs a `--features cuda` build and CUDA 13 +
# cuDNN 9 in the host).
provider = "cuda"

# Window overlap, 0.0 ..= 0.5. This is the **stride** dial: the model runs every
# `(1 - overlap) × 7.8 s` and every run costs a full window of compute, so `0.0` removes about a
# quarter of the work on a full track (31 → 24 windows) at the cost of weighting each window's edges
# more — a listening judgement, not a numeric one.
# overlap = 0.25

# Ensemble shifts: 1 is one pass, 2 averages a second, shifted run for ~2× the time.
#
# 1 is also the only setting that **streams**: blocks land in the deck as the model finishes them,
# which is what makes stems audible within seconds instead of after the whole track. The runtime
# cannot shift a stream, so 2 separates the whole track before installing anything.
# shifts = 1

# Threads the separator may use. 0 = let ONNX Runtime decide (every core).
#
# On a small device this is a **playback** setting rather than a performance one: a separation that
# takes every core starves the audio callback, and the mix stutters while the stems are prepared.
# Measured on a 16-core machine, 40 s of audio: auto 20 s, `2` 28 s (+40%) but only two cores busy.
# threads = 0

# Trade throughput for peak memory. On, ONNX Runtime's constant folding is disabled and activation
# memory is not pre-planned: HTDemucs drops from ~5.6 GB to ~2.1 GB of peak for ~11% less speed.
# low_memory = true

# There is no chunk length to set: the model already windows the track (7.8 s at a time, advancing
# `(1 - overlap) × 7.8 s`), and a block is handed over as soon as no later window can change it. That
# cadence *is* the chunking — a second, unrelated cutting of the track would have to be aligned to the
# window grid and re-normalised to sound like one piece.
