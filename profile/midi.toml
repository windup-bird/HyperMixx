# The shipped minimum for the development controller (Numark Party Mix III).
#
# Every unit binds one cluster of physical controls. Deck numbers are 1-based here and 0-based
# inside the engine. Re-learn a slot in the guide if a controller number differs.
[meta]
name = "shipped-minimum"
device = "Numark Party Mix III:Numark Party Mix III MIDI 1 24:0"

# ---- deck 1 ----------------------------------------------------------------------------------
[[unit]]
id = "deck1.transport"
preset = "transport"
deck = 1

[[unit.control]]
slot = "play"
endpoint = { midi = "note", channel = 0, id = 0 }
[[unit.control]]
slot = "cue"
endpoint = { midi = "note", channel = 0, id = 1 }
[[unit.control]]
slot = "sync"
endpoint = { midi = "note", channel = 0, id = 2 }
[[unit.control]]
slot = "keylock"
endpoint = { midi = "note", channel = 0, id = 3 }

[[unit]]
id = "deck1.jog"
preset = "jog"
deck = 1

[[unit.control]]
slot = "jog"
endpoint = [
  { role = "press", midi = "note", channel = 0, id = 80 },
  { role = "turn", midi = "cc", encoding = "two_point", channel = 0, id = 6 },
]

[[unit]]
id = "deck1.mixer"
preset = "mixer"
deck = 1

[[unit.control]]
slot = "fader"
endpoint = { midi = "cc", channel = 0, id = 28 }
[[unit.control]]
slot = "low"
endpoint = { midi = "cc", channel = 0, id = 25 }
[[unit.control]]
slot = "mid"
endpoint = { midi = "cc", channel = 0, id = 24 }
[[unit.control]]
slot = "high"
endpoint = { midi = "cc", channel = 0, id = 23 }
[[unit.control]]
slot = "filter"
endpoint = { midi = "cc", channel = 0, id = 26 }
[[unit.control]]
slot = "cue-toggle"
endpoint = { midi = "note", channel = 0, id = 27 }

[[unit]]
id = "deck1.browser"
preset = "browser"
deck = 1

[[unit.control]]
slot = "choose"
endpoint = { midi = "cc", encoding = "two_point", reverse = true, channel = 15, id = 0 }
[[unit.control]]
slot = "open"
endpoint = { midi = "note", channel = 15, id = 7 }

# ---- tempo faders ----------------------------------------------------------------------------
# The fader sends a 14-bit pair: #9 is the MSB, #41 the LSB.
[[unit]]
id = "deck1.tempo"
preset = "tempofader"
deck = 1

[[unit.control]]
slot = "fader"
endpoint = { midi = "cc", lsb = 41, channel = 0, id = 9 }

# ---- deck 2 ----------------------------------------------------------------------------------
