# MIDI input for this profile.
#
# `device` is what `--midi` takes: a **port name substring** (case-insensitive, first match wins) or
# an index from `midi ports`. With no device, no input is opened at startup — the TUI can still pick
# one with `F2`.
#
# device = "DDJ-400"
#
# The mapping file. Relative paths are relative to *this file*, so `"midi-map.toml"` here means
# `profile/midi-map.toml`; the shipped root map is one directory up. Left unset, the historical
# default applies: `midi-map.toml` in the working directory.
#
# map = "../midi-map.toml"
