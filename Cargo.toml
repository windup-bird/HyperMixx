[workspace]
resolver = "2"
members = [
    "crates/hypermixx-audio",
    "crates/hypermixx-analysis",
    "crates/hypermixx-cli",
    "crates/stratum-dsp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cpal = "0.15"
rtrb = "0.3"
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "mp1",
    "mp2",
    "wav",
    "aiff",
    "flac",
    "pcm",
    "isomp4",
    "aac",
    "ogg",
    "vorbis",
] }
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
