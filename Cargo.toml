[workspace]
resolver = "2"
members = [
    "crates/hypermixx-core",
    "crates/hypermixx-media",
    "crates/hypermixx-audio",
    "crates/hypermixx-library",
    "crates/hypermixx-stems",
    "crates/hypermixx-midi",
    "crates/hypermixx-cli",
]
exclude = ["vendor/signalsmith-stretch"]

# Hypermixx needs one change to `charon-audio` that upstream 0.1.2 does not have: a CUDA
# execution provider alongside its CPU/CoreML ones. It lives in our fork,
# `windup-bird/charon-audio-cuda`, branch `feat/cuda-ep`, which is upstream `v0.1.2` plus
# that provider. See `docs/stem.md` §4 for why a fork and not a patch, and the fork's
# `FORK.md` for the diff and the measurements.
[patch.crates-io]
charon-audio = { git = "https://github.com/windup-bird/charon-audio-cuda", branch = "feat/cuda-ep" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cpal = "0.15"
rtrb = "0.3"
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "mp1",
    "mp2",
    "wav",
    "aiff",
    "flac",
    "pcm",
    "isomp4",
    "aac",
    "ogg",
    "vorbis",
] }
crossbeam-channel = "0.5"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# TUI only. Minimal features: `crossterm` pulls in std + the widgets crate; the default
# `all-widgets` would drag in the calendar/time stack we never draw.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
# MIDI input. `midir`'s ALSA backend rides the `alsa`/`alsa-sys` crates cpal already pulls in, so
# this adds no new C dependency. Input and output share one API, which keeps LED feedback (future)
# on the same library.
midir = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
