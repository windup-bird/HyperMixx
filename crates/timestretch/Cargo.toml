[package]
name = "timestretch"
version = "0.15.0"
edition = "2024"
rust-version = "1.85"
description = "Vendored copy of timestretch-rs: real-time audio time stretching (varispeed, SOLA keylock, phase vocoder)"
license = "MIT"

[dependencies]
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ebur128 = "0.1.10"

[lib]
name = "timestretch"
path = "src/lib.rs"
