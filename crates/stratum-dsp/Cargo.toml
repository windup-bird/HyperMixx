[package]
name = "stratum-dsp"
version = "1.0.0"
edition = "2021"
description = "Vendored copy of stratum-dsp: BPM detection, key detection, and beat tracking"
license = "MIT OR Apache-2.0"

[dependencies]
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rayon = "1.8"

[lib]
name = "stratum_dsp"
path = "src/lib.rs"

# The upstream crate has an optional `ml` feature gated on `ort` (ONNX Runtime), but the ML
# refinement is an unimplemented stub and `models/` is empty, so we vendor without it. Declaring
# the feature as a no-op keeps `#[cfg(feature = "ml")]` in the source valid and warning-free.
[features]
ml = []
