[package]
name = "hypermixx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command line front-end for the Hypermixx audio engine"

[[bin]]
name = "hypermixx-cli"
path = "src/main.rs"

[dependencies]
hypermixx-core = { path = "../hypermixx-core" }
hypermixx-media = { path = "../hypermixx-media" }
hypermixx-audio = { path = "../hypermixx-audio" }
hypermixx-library = { path = "../hypermixx-library" }
hypermixx-stems = { path = "../hypermixx-stems" }
hypermixx-midi = { path = "../hypermixx-midi" }
crossbeam-channel = { workspace = true }
toml = { workspace = true }
# Comment-preserving TOML rewrite for the settings screen: `toml` alone would drop every comment
# and reorder a hand-written config.
toml_edit = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
sysinfo = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Only for the TUI's stderr capture: rebinding fd 2 so engine/ALSA diagnostics land in the response
# log instead of scribbling the alternate screen.
libc = "0.2"

[features]
# GPU stem separation. Off by default: the CPU path is complete without it, and this pulls the
# CUDA-enabled ONNX Runtime prebuilt (~183 MB) and needs CUDA 13 + cuDNN 9 on the host.
cuda = ["hypermixx-stems/cuda"]
