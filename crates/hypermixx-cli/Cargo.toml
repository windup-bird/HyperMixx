[package]
name = "hypermixx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command line front-end for the Hypermixx audio engine"

[[bin]]
name = "hypermixx-cli"
path = "src/main.rs"

[dependencies]
hypermixx-core = { path = "../hypermixx-core" }
hypermixx-media = { path = "../hypermixx-media" }
hypermixx-audio = { path = "../hypermixx-audio" }
hypermixx-library = { path = "../hypermixx-library" }
hypermixx-midi = { path = "../hypermixx-midi" }
crossbeam-channel = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
