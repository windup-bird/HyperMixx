# A deck strip's mirror toggle: the unit flips **its own** normal/mirror deck maps. The unit
# binds the note number; the deck list lives in `[[multideck.deck]] source`.
[[preset]]
name = "mirror-deck"
scope = "deck"
start = "default"

[[preset.slot]]
slot = "toggle"
type = "Button"
role = "deck_mirror"

[[preset.mode]]
name = "default"
