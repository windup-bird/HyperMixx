# A platter. The press note is the touch; the CC is the wheel. Three modes: scratch, slip, bend.
[[preset]]
name = "jog"
scope = "deck"
start = "vinyl"

[[preset.slot]]
slot = "jog"
type = "JogWheel"

[[preset.mode]]
name = "vinyl"
[[preset.mode.bind]]
slot = "jog"
action = "vinyl"

[[preset.mode]]
name = "slip"
[[preset.mode.bind]]
slot = "jog"
press = "vinyl slip"
turn = "vinyl"

[[preset.mode]]
name = "nudge"
[[preset.mode.bind]]
slot = "jog"
turn = "nudge 0.15"
