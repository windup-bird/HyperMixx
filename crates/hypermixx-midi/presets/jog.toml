# A platter. The press note is the touch; the CC is the wheel. Three modes: scratch, slip, bend.
# A turn means two things: with a hand on the platter it scrubs (`vinyl`), with nobody on it it
# bends the rate. `bend` tunes that second half; `action`/`turn` keeps tuning the first.
[[preset]]
name = "jog"
scope = "deck"
start = "vinyl"

[[preset.slot]]
slot = "jog"
type = "JogWheel"

[[preset.mode]]
name = "vinyl"
[[preset.mode.bind]]
slot = "jog"
# frames_per_tick = 1.8 s of audio / ticks per revolution at the engine rate.
# 234 assumes a 340-tick wheel at 44.1 kHz; change this when calibrating a controller.
action = "vinyl 234"
# Nobody on the platter: a short rate bend that lets go after the last tick.
bend = "bend 0.05 0.05"

[[preset.mode]]
name = "slip"
[[preset.mode.bind]]
slot = "jog"
press = "vinyl slip"
turn = "vinyl 234"
bend = "bend 0.05 0.05"

[[preset.mode]]
name = "bend"
[[preset.mode.bind]]
slot = "jog"
turn = "bend 0.05 0.05"
