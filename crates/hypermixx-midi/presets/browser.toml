# Library navigation. `both` scope: a browser strip can be global or live on one deck.
[[preset]]
name = "browser"
scope = "both"
start = "default"

# A two-point encoder: 1 = one step, 127 = the other. Reversed once here because the shipped
# encoder turns the other way.
[[preset.slot]]
slot = "browse"
type = "RelKnob"
[[preset.slot]]
slot = "open"
type = "Button"
[[preset.slot]]
slot = "exit"
type = "Button"
[[preset.slot]]
slot = "load"
type = "Button"

[[preset.mode]]
name = "default"
[[preset.mode.bind]]
slot = "browse"
action = "browser down"
down = "browser up"
[[preset.mode.bind]]
slot = "open"
action = "browser open"
[[preset.mode.bind]]
slot = "exit"
action = "browser exit"
[[preset.mode.bind]]
slot = "load"
action = "browser load"
